services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: shaheen-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shaheen
      POSTGRES_PASSWORD: shaheen
      POSTGRES_DB: shaheen_ai
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shaheen -d shaheen_ai']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
